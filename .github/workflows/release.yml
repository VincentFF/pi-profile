# Automated release pipeline:
#   push to main → release-please opens/updates a Release PR (version bump + CHANGELOG)
#   → merge that PR → git tag + GitHub Release created → test → publish to npm.
#
# The publish job lives in THIS workflow (not a `release: created` workflow) because
# releases created with the default GITHUB_TOKEN never trigger other workflows.
#
# token: RELEASE_PLEASE_TOKEN is a fine-grained PAT (contents: write, pull-requests:
# write). Events authored by the default GITHUB_TOKEN do not start workflows, so
# without it the Release PR gets no CI runs and branch protection blocks the merge.
# With it the Release PR triggers `test` and `lint-pr-title` like any other PR.
# Without the secret the fallback is to close and reopen the Release PR by hand.
#
# npm auth uses Trusted Publishing (OIDC) — no token secret needed. One-time setup:
#   1. Publish v0.1.0 once by hand: `npm login` then `npm publish` (package must exist
#      on npm before a trusted publisher can be attached to it).
#   2. npmjs.com → package → Settings → Publishing access → add GitHub Actions
#      trusted publisher: owner=VincentFF, repo=pi-profile-switch, workflow=release.yml.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write       # tags, GitHub Releases, version-bump commits
  pull-requests: write  # open/update the Release PR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that is publishing to npm

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  publish-npm:
    needs: [release-please, test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }} # publish the tagged commit
      - uses: actions/setup-node@v4 # node 24 ships npm >= 11.5.1, required for trusted publishing
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --provenance
