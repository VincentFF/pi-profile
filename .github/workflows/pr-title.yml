# The squash-merge commit on main is the PR title (repository setting), and
# release-please derives the next version from the types of the commits that
# land on main. This check keeps PR titles valid Conventional Commits so a
# release can never be silently swallowed by a malformed or non-releasable
# title — the usual failure being `chore: ...` wrapping real `feat:` work.
name: PR title

on:
  pull_request:
    # synchronize matters: required checks are tracked per commit, so the title
    # check must re-report on every new head commit of the PR.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^(feat|fix|deps|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            {
              echo "::error::PR title is not a Conventional Commit: \"$TITLE\""
              echo
              echo "Expected: <type>[(scope)][!]: <summary>"
              echo "Types: feat fix deps docs style refactor perf test build ci chore revert"
              echo
              echo "Examples:"
              echo "  feat: add a filter to the profile picker"
              echo "  fix(skills): keep unselected skills user-invocable"
              echo "  feat!: drop catalog schemaVersion 1"
            } >&2
            exit 1
          fi

          # The regex lives in a variable: an unquoted `)` directly inside
          # `[[ =~ ]]` is a bash parse error.
          breaking='^[a-z]+(\([^)]*\))?!: '
          type=$(printf '%s' "$TITLE" | sed -E 's/^([a-z]+).*/\1/')
          if [[ "$TITLE" =~ $breaking ]]; then
            bump="breaking → minor while < 1.0.0 (next release 0.x.0)"
          elif [[ "$type" == "feat" ]]; then
            bump="minor → next release 0.x.0"
          elif [[ "$type" == "fix" || "$type" == "deps" ]]; then
            bump="patch → next release 0.x.y"
          else
            bump="no release (only feat / fix / deps are releasable units)"
          fi

          echo "OK: $TITLE"
          echo "release-please: $bump"
